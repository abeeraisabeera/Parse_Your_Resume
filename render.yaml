services:
  - type: web
    name: resume-parser-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SHORTLIST_THRESHOLD
        value: "85"
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
